backend:
  name: git-gateway
  branch: main

locale: fr
publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "convocations"
    label: "Convocations"
    description: "Modifier les informations de match et les joueurs/joueuses convoqués. Le bouton d'effacement est disponible dans chaque catégorie."
    files:
      - name: "convocations"
        label: "Convocations par catégorie"
        file: "data/convocations.json"
        format: "json"
        fields:
          - label: "Convocations par catégorie"
            name: "categories"
            widget: "convocationCategories"
            hint: "Sélectionnez une catégorie pour modifier ou effacer ses convocations."
  - name: "resultats"
    label: "Résultats"
    description: "Ajouter, modifier ou supprimer les résultats des matchs."
    files:
      - name: "resultats"
        label: "Résultats des matchs"
        file: "data/resultats.json"
        format: "json"
        fields:
          - label: "Matchs"
            name: "matches"
            widget: "resultsByCategory"
            hint: "Sélectionnez d'abord la compétition et l'équipe. Un résultat de coupe est soit gagné, soit perdu."
  - name: "actualites"
    label: "Actualités"
    description: "Créer, modifier et publier les articles du club."
    files:
      - name: "articles"
        label: "Articles publiés"
        file: "data/actualites.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            add_to_top: true
            collapsed: true
            label_singular: "article"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Identifiant automatique", name: "slug", widget: "hidden", required: false, default: "" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date (AAAA-MM-JJ)", name: "date", widget: "string", hint: "Exemple : 2026-09-27" }
              - { label: "Catégorie", name: "category", widget: "string", default: "Actualité" }
              - { label: "Résumé automatique", name: "summary", widget: "hidden", required: false, default: "" }
              - label: "Photos"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Photo", name: "image", widget: "image" }
              - { label: "Texte de l'article", name: "body", widget: "text", hint: "Séparez les paragraphes par une ligne vide. Le résumé affiché dans la liste sera généré à partir du début de ce texte." }
