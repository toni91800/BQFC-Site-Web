backend:
  name: git-gateway
  branch: main

locale: fr
publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "buvette"
    label: "Buvette"
    description: "Ajouter, modifier, réordonner ou supprimer les produits et leurs prix."
    files:
      - name: "buvette"
        label: "Produits de la buvette"
        file: "data/buvette.json"
        format: "json"
        fields:
          - label: "Produits"
            name: "products"
            widget: "buvetteProducts"
            hint: "Renseignez le nom et le prix de chaque produit. Les changements seront publiés sur le site après enregistrement."
  - name: "convocations"
    label: "Convocations"
    description: "Modifier les informations de match et les joueurs/joueuses convoqués. Le bouton d'effacement est disponible dans chaque catégorie."
    files:
      - name: "convocations"
        label: "Convocations par catégorie"
        file: "data/convocations.json"
        format: "json"
        fields:
          - label: "Convocations par catégorie"
            name: "categories"
            widget: "convocationCategories"
            hint: "Sélectionnez une catégorie pour modifier ou effacer ses convocations."
  - name: "resultats"
    label: "Résultats"
    description: "Ajouter, modifier ou supprimer les résultats des matchs."
    files:
      - name: "resultats"
        label: "Résultats des matchs"
        file: "data/resultats.json"
        format: "json"
        fields:
          - label: "Matchs"
            name: "matches"
            widget: "resultsByCategory"
            hint: "Sélectionnez d'abord la compétition et l'équipe. Un résultat de coupe est soit gagné, soit perdu."
  - name: "organigramme"
    label: "Organigramme"
    description: "Modifiez les responsables du club, leur prénom et leur photo. Les champs suivent le style des formulaires Résultats et Convocations."
    files:
      - name: "membres"
        label: "Membres du club"
        file: "data/organigramme.json"
        format: "json"
        fields:
          - label: "Rôles de l'organigramme"
            name: "roles"
            widget: "list"
            add_to_top: true
            collapsed: true
            minimize_collapsed: true
            label_singular: "rôle"
            summary: "{{fields.role}} - {{fields.name}}"
            hint: "Renseignez le rôle, le prénom et la photo. Utilisez les boutons pour ajouter, réordonner ou retirer une personne."
            fields:
              - { label: "Rôle", name: "role", widget: "string" }
              - { label: "Prénom(s) du/des membre(s)", name: "name", widget: "string", required: false, hint: "Laisser vide pour afficher « Prochainement »." }
              - { label: "Photo du membre", name: "photo", widget: "image", required: false }
  - name: "planning"
    label: "Planning des entraînements"
    description: "Choisissez une catégorie pour modifier son année, ses horaires et son entraîneur."
    files:
      - name: "planning"
        label: "Entraînements par catégorie"
        file: "data/planning.json"
        format: "json"
        fields:
          - label: "Planning par catégorie"
            name: "categories"
            widget: "planningByCategory"
            hint: "Choisissez une catégorie, puis modifiez les champs clairement identifiés."
  - name: "contacts"
    label: "Contact et responsables"
    description: "Modifiez les coordonnées affichées sur la page Contact et les responsables de chaque catégorie."
    files:
      - name: "contacts"
        label: "Coordonnées et responsables"
        file: "data/contacts.json"
        format: "json"
        fields:
          - label: "Coordonnées de la page Contact"
            name: "details"
            widget: "clubContactDetails"
            hint: "Ces champs alimentent la page Contact et le pied de page. Les liens de carte doivent commencer par https://."
          - label: "Responsables par catégorie"
            name: "categoryContacts"
            widget: "categoryContacts"
            hint: "Choisissez une catégorie et renseignez le nom ainsi que le numéro qui apparaîtront dans les contacts."
          - label: "Direction et responsables du club"
            name: "clubContacts"
            widget: "clubContacts"
            hint: "Modifiez les rôles, noms et numéros de téléphone affichés sous les coordonnées."
  - name: "documents"
    label: "Documents officiels"
    description: "Ajouter, modifier ou supprimer les PDF mis à disposition des visiteurs du site."
    files:
      - name: "documents"
        label: "Documents du club"
        file: "data/documents.json"
        format: "json"
        fields:
          - label: "Documents"
            name: "documents"
            widget: "list"
            add_to_top: true
            collapsed: true
            label_singular: "document"
            summary: "{{fields.title}}"
            fields:
              - { label: "Nom du document PDF", name: "title", widget: "string" }
              - label: "Fichier PDF"
                name: "file"
                widget: "file"
                media_folder: "/documents"
                public_folder: "/documents"
                choose_url: false
                hint: "Déposez le PDF ici. Il sera téléversé dans le dossier documents du dépôt Git et son lien sera ajouté automatiquement."
