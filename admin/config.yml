backend:
  name: git-gateway
  branch: main

locale: fr
publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "convocations"
    label: "Convocations"
    description: "Modifier les informations de match et les joueurs/joueuses convoqués. Le bouton d'effacement est disponible dans chaque catégorie."
    files:
      - name: "convocations"
        label: "Convocations par catégorie"
        file: "data/convocations.json"
        format: "json"
        fields:
          - label: "Convocations par catégorie"
            name: "categories"
            widget: "convocationCategories"
            hint: "Sélectionnez une catégorie pour modifier ou effacer ses convocations."
  - name: "resultats"
    label: "Résultats"
    description: "Ajouter, modifier ou supprimer les résultats des matchs."
    files:
      - name: "resultats"
        label: "Résultats des matchs"
        file: "data/resultats.json"
        format: "json"
        fields:
          - label: "Matchs"
            name: "matches"
            widget: "resultsByCategory"
            hint: "Sélectionnez d'abord la compétition et l'équipe. Un résultat de coupe est soit gagné, soit perdu."
  - name: "actualites"
    label: "Actualités"
    description: "Utilisez « Ajouter article » pour créer une actualité. Cliquez sur un article pour ouvrir ses champs. Les articles sont automatiquement classés du plus récent au plus ancien à l'enregistrement."
    files:
      - name: "articles"
        label: "Articles publiés"
        file: "data/actualites.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            add_to_top: true
            collapsed: true
            minimize_collapsed: true
            label_singular: "article"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Identifiant automatique", name: "slug", widget: "hidden", required: false, default: "" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date", name: "date", widget: "string", hint: "Saisissez la date au format JJ/MM/AAAA, par exemple 27/09/2026." }
              - { label: "Catégorie", name: "category", widget: "newsCategory", default: "Informations", hint: "Choisissez une catégorie dans la liste. Pour en créer une, sélectionnez « Autre » puis saisissez son nom ; elle sera proposée dans la liste lors de vos prochaines utilisations." }
              - { label: "Résumé automatique", name: "summary", widget: "hidden", required: false, default: "" }
              - label: "Photos de l'article"
                name: "images"
                widget: "list"
                required: false
                add_to_top: true
                label_singular: "photo"
                allow_add: true
                allow_remove: true
                allow_reorder: true
                hint: "Cliquez sur « Ajouter photo » pour ajouter une nouvelle image sans remplacer les précédentes. Chaque photo se règle séparément ; vous pouvez les réordonner ou les supprimer."
                field:
                  label: "Photo"
                  name: "photo"
                  widget: "image"
              - { label: "Texte de l'article", name: "body", widget: "text", hint: "Séparez les paragraphes par une ligne vide. Le résumé affiché dans la liste sera généré à partir du début de ce texte." }
  - name: "organigramme"
    label: "Organigramme"
    description: "Ajouter ou supprimer des rôles et renseigner le prénom et la photo de chaque membre."
    files:
      - name: "membres"
        label: "Membres du club"
        file: "data/organigramme.json"
        format: "json"
        fields:
          - label: "Rôles de l'organigramme"
            name: "roles"
            widget: "list"
            add_to_top: true
            collapsed: true
            minimize_collapsed: true
            label_singular: "rôle"
            summary: "{{fields.role}} — {{fields.name}}"
            fields:
              - { label: "Rôle", name: "role", widget: "string" }
              - { label: "Prénom(s) du/des membre(s)", name: "name", widget: "string", required: false, hint: "Laisser vide pour afficher « Prochainement »." }
              - { label: "Photo du membre", name: "photo", widget: "image", required: false }
