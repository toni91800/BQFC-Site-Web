backend:
  name: git-gateway
  branch: main

locale: fr
publish_mode: simple

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "convocations"
    label: "Convocations"
    description: "Modifier les informations de match et les joueurs/joueuses convoqués."
    files:
      - name: "convocations"
        label: "Convocations par catégorie"
        file: "data/convocations.json"
        format: "json"
        fields:
          - label: "U6/U7"
            name: "u6u7"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 4
                max: 4
                fields: &team_fields
                  - { label: "Nom de l'équipe", name: "name", widget: "string" }
                  - { label: "Adversaire", name: "opponent", widget: "string", required: false }
                  - { label: "Date du match", name: "date", widget: "string", required: false }
                  - { label: "Lieu", name: "location", widget: "string", required: false }
                  - { label: "Heure du rendez-vous", name: "meetingTime", widget: "string", required: false }
                  - { label: "Heure du match", name: "matchTime", widget: "string", required: false }
                  - label: "Joueurs / joueuses convoqués"
                    name: "players"
                    widget: "list"
                    field: { label: "Nom", name: "name", widget: "string" }
          - label: "U8/U9"
            name: "u8u9"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 4
                max: 4
                fields: *team_fields
          - label: "U10"
            name: "u10"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 2
                max: 2
                fields: *team_fields
          - label: "U11"
            name: "u11"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 2
                max: 2
                fields: *team_fields
          - label: "U11 F"
            name: "u11F"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 1
                max: 1
                fields: *team_fields
          - label: "U12"
            name: "u12"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 2
                max: 2
                fields: *team_fields
          - label: "U13"
            name: "u13"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 2
                max: 2
                fields: *team_fields
          - label: "U13 F"
            name: "u13F"
            widget: "object"
            fields:
              - label: "Équipes"
                name: "teams"
                widget: "list"
                min: 1
                max: 1
                fields: *team_fields
  - name: "actualites"
    label: "Actualités"
    description: "Créer, modifier et publier les articles du club."
    files:
      - name: "articles"
        label: "Articles publiés"
        file: "data/actualites.json"
        format: "json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            add_to_top: true
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - { label: "Identifiant (sans espaces)", name: "slug", widget: "string", hint: "Exemple : victoire-seniors-2026" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Date (AAAA-MM-JJ)", name: "date", widget: "string", hint: "Exemple : 2026-09-27" }
              - { label: "Catégorie", name: "category", widget: "string", default: "Actualité" }
              - { label: "Résumé affiché dans la liste", name: "summary", widget: "text" }
              - label: "Photos"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Photo", name: "image", widget: "image" }
              - { label: "Texte de l'article", name: "body", widget: "text", hint: "Séparez les paragraphes par une ligne vide. Un retour à la ligne simple reste dans le même paragraphe." }
